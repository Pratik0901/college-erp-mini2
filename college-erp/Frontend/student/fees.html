<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fee Portal</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Add jsPDF library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      background: #f6f8fb;
      padding: 20px;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-link {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(20, 30, 50, 0.06);
      padding: 20px;
      margin-bottom: 16px;
    }
    h3 {
      margin: 0 0 12px;
      font-weight: 700;
      font-size: 20px;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #222;
      font-size: 14px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: #2b6cb0;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
    }
    .btn {
      background: #2b6cb0;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1e4d7b;
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn.secondary {
      background: #edf2f7;
      color: #222;
      border: 1px solid #e2e8f0;
    }
    .btn.secondary:hover {
      background: #e2e8f0;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .muted {
      color: #7b8794;
    }
    .small-muted {
      color: #97a0ab;
      font-size: 13px;
    }
    .fees-list-item {
      padding: 12px;
      border-bottom: 1px solid #eef2f6;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .fees-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-pending {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    .status-paid {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status-failed {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .pay-btn {
      background: #28a745;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }
    .pay-btn:hover {
      background: #218838;
    }
    .pay-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    .download-btn {
      background: #17a2b8;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }
    
    .download-btn:hover {
      background: #138496;
    }
    
    .download-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    /* Success Popup Styles */
    .success-popup {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    
    .success-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    
    .success-icon {
      font-size: 60px;
      color: #28a745;
      margin-bottom: 20px;
    }
    
    .success-title {
      font-size: 24px;
      font-weight: 700;
      color: #28a745;
      margin-bottom: 10px;
    }
    
    .success-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 25px;
    }
    
    .payment-details {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      text-align: left;
    }
    
    .payment-details .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .detail-row:last-child {
      margin-bottom: 0;
    }
    
    .detail-label {
      font-weight: 600;
      color: #333;
    }
    
    .detail-value {
      color: #666;
    }
    
    .btn-download {
      background: #007bff;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.2s;
    }
    
    .btn-download:hover {
      background: #0056b3;
    }
    
    .btn-close {
      background: #6c757d;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-close:hover {
      background: #545b62;
    }
    @media (max-width: 600px) {
      .button-group {
        flex-direction: column;
      }
      .button-group .btn {
        width: 100%;
      }
      .fees-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back-link" href="student-dashboard.html">← Back to Dashboard</a>
      <div class="small-muted">Fee Portal</div>
    </div>

    <div class="card">
      <h3>💳 Fee Payment</h3>
      <p class="muted">Create a new fee request or view your existing fee records below.</p>

      <form id="feeForm" style="margin-top: 16px">
        <div class="form-group">
          <label>Amount (INR)</label>
          <input type="number" id="feeAmount" min="0" step="0.01" required placeholder="e.g., 1500">
        </div>

        <div class="form-group">
          <label>Reason for payment</label>
          <select id="feeReasonSelect" required>
            <option value="">-- Select reason --</option>
            <option value="Tuition Fee">Tuition Fee</option>
            <option value="Exam Fee">Exam Fee</option>
            <option value="Library Fine">Library Fine</option>
            <option value="Hostel">Hostel</option>
            <option value="Other">Other (specify below)</option>
          </select>
        </div>

        <div class="form-group" id="otherReasonGroup" style="display: none">
          <label>Other - specify</label>
          <input type="text" id="feeReasonOther" maxlength="200" placeholder="Enter reason">
        </div>

        <div class="form-group">
          <label>Preferred payment method (optional)</label>
          <select id="paymentMethod">
            <option value="">-- Select --</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="NetBanking">NetBanking</option>
            <option value="Cash">Cash</option>
          </select>
        </div>

        <div class="button-group">
          <button class="btn" type="submit">Create Fee Request</button>
          <button class="btn secondary" type="button" id="refreshFeesBtn">Refresh List</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>📋 Your Fee Records</h3>
      <div id="studentFeesList">
        <p class="muted">Loading...</p>
      </div>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="successPopup" class="success-popup">
    <div class="success-content">
      <div class="success-icon">✅</div>
      <div class="success-title">Payment Successful!</div>
      <div class="success-message">Your payment has been processed successfully.</div>
      
      <div class="payment-details">
        <div class="detail-row">
          <span class="detail-label">Amount:</span>
          <span class="detail-value" id="successAmount">₹0.00</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Reference ID:</span>
          <span class="detail-value" id="successReference">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Purpose:</span>
          <span class="detail-value" id="successPurpose">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Date:</span>
          <span class="detail-value" id="successDate">-</span>
        </div>
      </div>
      
      <div>
        <button class="btn-download" onclick="downloadReceipt()">📄 Download Receipt</button>
        <button class="btn-close" onclick="closeSuccessPopup()">Close</button>
      </div>
    </div>
  </div>

  <script>
    function ensureStudent() {
      const token = localStorage.getItem('studentToken');
      const sStr = localStorage.getItem('studentData');
      if (!token || !sStr) { window.location.href = 'student-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        return { token, student: s };
      } catch { window.location.href = 'student-login.html'; return null; }
    }

    function getStatusClass(status) {
      if (status === 'paid') return 'status-paid';
      if (status === 'failed') return 'status-failed';
      return 'status-pending';
    }

    function renderFees(fees) {
      if (!fees || fees.length === 0) {
        document.getElementById('studentFeesList').innerHTML = '<div class="muted">No fee records found</div>';
        return;
      }
      const html = fees.map(f => {
        const due = f.due_date ? ('Due: ' + new Date(f.due_date).toLocaleDateString()) : '';
        const created = f.created_at ? new Date(f.created_at).toLocaleString() : '';
        const statusClass = getStatusClass(f.status);
        
        // Add Pay Now button for pending fees
        const payButton = f.status === 'pending' ? 
          `<button class="pay-btn" onclick="payFeeUPI(${f.id}, ${f.amount}, '${f.reason || 'Fee'}')">💳 Pay Now</button>` : '';
        
        // Add Download button for paid fees
        const downloadButton = f.status === 'paid' && f.payment_reference ? 
          `<button class="download-btn" onclick="downloadPaidReceipt(${f.id}, '${f.payment_reference}', ${f.amount}, '${f.reason || 'Fee'}', '${f.created_at}')">📄 Download</button>` : '';
        
        return `
          <div class="fees-list-item">
            <div class="fees-top">
              <div><strong>₹${parseFloat(f.amount).toFixed(2)}</strong> — <span class="muted">${f.reason || '—'}</span></div>
              <div>
                <span class="status-badge ${statusClass}">${(f.status || 'pending').toUpperCase()}</span>
                ${payButton}
                ${downloadButton}
              </div>
            </div>
            <div class="small-muted">
              ${due ? due + ' • ' : ''}${f.payment_method ? f.payment_method + ' • ' : ''}${f.payment_reference ? 'Ref: ' + f.payment_reference + ' • ' : ''}Created: ${created}
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('studentFeesList').innerHTML = html;
    }

    async function loadStudentFees() {
      const ctx = ensureStudent(); if (!ctx) return;
      try {
        const userId = ctx.student.id;
        const res = await fetch(`/api/student/${userId}/fees`);
        const j = await res.json();
        if (!res.ok) {
          document.getElementById('studentFeesList').innerHTML = '<div class="muted">Error loading fees</div>';
          return;
        }
        renderFees(j);
      } catch (err) {
        console.error(err);
        document.getElementById('studentFeesList').innerHTML = '<div class="muted">Network error</div>';
      }
    }

    document.getElementById('feeReasonSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      document.getElementById('otherReasonGroup').style.display = val === 'Other' ? 'block' : 'none';
      if (val !== 'Other') document.getElementById('feeReasonOther').value = '';
    });

    document.getElementById('feeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ctx = ensureStudent(); if (!ctx) return;
      const userId = ctx.student.id;
      const amount = parseFloat(document.getElementById('feeAmount').value || '0');
      if (!amount || amount <= 0) { alert('Enter a valid amount'); return; }

      let reason = document.getElementById('feeReasonSelect').value;
      if (!reason) { alert('Choose a reason'); return; }
      if (reason === 'Other') {
        const other = document.getElementById('feeReasonOther').value.trim();
        if (!other) { alert('Please specify the reason'); return; }
        reason = other;
      }

      const payment_method = document.getElementById('paymentMethod').value || null;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const res = await fetch(`/api/student/${userId}/pay-fee`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            amount: amount,
            reason: reason,
            payment_method: payment_method
          })
        });
        const j = await res.json();
        if (!res.ok) {
          alert('Error: ' + (j.error || 'Failed to create fee'));
          return;
        }
        alert('✓ Fee request created successfully! Status: Pending');
        document.getElementById('feeForm').reset();
        document.getElementById('otherReasonGroup').style.display = 'none';
        loadStudentFees();
      } catch (err) {
        console.error(err);
        alert('Network error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Fee Request';
      }
    });

    document.getElementById('refreshFeesBtn').addEventListener('click', loadStudentFees);

    // Store current payment data for receipt generation
    let currentPaymentData = null;

    function showSuccessPopup(paymentData) {
      currentPaymentData = paymentData;
      const popup = document.getElementById('successPopup');
      
      // Populate success popup data
      document.getElementById('successAmount').textContent = '₹' + paymentData.amount.toFixed(2);
      document.getElementById('successReference').textContent = paymentData.payment_reference;
      document.getElementById('successPurpose').textContent = paymentData.reason;
      document.getElementById('successDate').textContent = new Date(paymentData.paid_at).toLocaleDateString();
      
      // Show popup
      popup.style.display = 'block';
      
      // Auto-close popup after 8 seconds
      setTimeout(() => {
        if (popup.style.display === 'block') {
          closeSuccessPopup();
        }
      }, 8000);
    }

    function closeSuccessPopup() {
      document.getElementById('successPopup').style.display = 'none';
      currentPaymentData = null;
    }

    function downloadReceipt() {
      if (!currentPaymentData) {
        alert('No payment data available');
        return;
      }

      try {
        // Initialize jsPDF
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Helper function to safely convert text
        function safeText(text) {
          if (!text) return '-';
          return String(text).replace(/[^\x20-\x7E]/g, '');
        }

        // Helper function to split text if too long
        function splitText(text, maxWidth) {
          return doc.splitTextToSize(safeText(text), maxWidth);
        }

        // Set font
        doc.setFont('helvetica');

        // Header
        doc.setFontSize(20);
        doc.setTextColor(43, 108, 176);
        doc.text('Payment Receipt', 105, 30, { align: 'center' });

        doc.setFontSize(12);
        doc.setTextColor(102, 102, 102);
        doc.text('College Fee Management System', 105, 40, { align: 'center' });

        // Success badge
        doc.setFillColor(40, 167, 69);
        doc.roundedRect(70, 50, 70, 12, 3, 3, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(10);
        doc.text('PAYMENT SUCCESSFUL', 105, 58, { align: 'center' });

        // Reset text color
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(11);

        // Receipt details
        const leftCol = 30;
        const rightCol = 80;
        const maxWidth = 110;
        let currentY = 80;

        // Helper to add row with proper wrapping
        function addRow(label, value, isAmount = false) {
          doc.setFont('helvetica', 'bold');
          doc.text(safeText(label), leftCol, currentY);
          
          doc.setFont('helvetica', 'normal');
          if (isAmount) {
            doc.setTextColor(43, 108, 176);
            doc.setFontSize(14);
            doc.text(safeText(value), rightCol, currentY);
            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            currentY += 12;
          } else {
            const lines = splitText(value, maxWidth);
            doc.text(lines, rightCol, currentY);
            currentY += (lines.length * 6) + 6;
          }
        }

        // Add receipt data with safe text conversion
        addRow('Receipt Number:', safeText(currentPaymentData.payment_reference));
        addRow('Student Name:', safeText(currentPaymentData.student_name));
        addRow('Roll Number:', safeText(currentPaymentData.student_roll));
        addRow('Amount Paid:', 'Rs ' + parseFloat(currentPaymentData.amount).toFixed(2), true);
        addRow('Purpose:', safeText(currentPaymentData.reason));
        addRow('Payment Method:', 'UPI');
        addRow('Transaction Ref:', safeText(currentPaymentData.payment_reference));
        
        const dateStr = new Date(currentPaymentData.paid_at).toLocaleDateString('en-IN') + ' ' + 
                       new Date(currentPaymentData.paid_at).toLocaleTimeString('en-IN');
        addRow('Payment Date:', dateStr);
        
        // Status
        doc.setFont('helvetica', 'bold');
        doc.text('Status:', leftCol, currentY);
        doc.setTextColor(40, 167, 69);
        doc.text('PAID', rightCol, currentY);
        doc.setTextColor(0, 0, 0);
        currentY += 15;

        // Line separator
        doc.setDrawColor(221, 221, 221);
        doc.line(30, currentY, 180, currentY);
        currentY += 15;

        // Footer
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.text('Thank you for your payment!', 105, currentY, { align: 'center' });
        currentY += 8;
        
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(102, 102, 102);
        
        const footerLines = splitText('This is a computer-generated receipt and does not require a signature.', 150);
        doc.text(footerLines, 105, currentY, { align: 'center' });
        currentY += footerLines.length * 5 + 5;
        
        doc.text('For queries, contact accounts department', 105, currentY, { align: 'center' });
        currentY += 5;
        doc.text('Email: accounts@college.edu', 105, currentY, { align: 'center' });

        // Verification
        currentY += 15;
        doc.setDrawColor(221, 221, 221);
        doc.line(30, currentY, 180, currentY);
        currentY += 10;
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(8);
        const genDate = new Date().toLocaleDateString('en-IN') + ' ' + new Date().toLocaleTimeString('en-IN');
        doc.text('Generated: ' + genDate, 105, currentY, { align: 'center' });
        currentY += 5;
        doc.text('Valid for official purposes', 105, currentY, { align: 'center' });

        // Verification code
        const verCode = String(currentPaymentData.payment_reference).slice(-6);
        doc.setFontSize(9);
        doc.text('Verification: ' + verCode, 105, currentY + 8, { align: 'center' });

        // Save PDF
        const fileName = 'Receipt_' + safeText(currentPaymentData.payment_reference) + '.pdf';
        doc.save(fileName);

        setTimeout(() => {
          alert('Receipt downloaded successfully!');
        }, 500);

      } catch (error) {
        console.error('PDF Error:', error);
        alert('Error generating PDF. Please try again.');
      }
    }

    async function payFeeUPI(feeId, amount, reason) {
      const payButton = event.target;
      payButton.disabled = true;
      payButton.textContent = 'Processing...';
      
      try {
        const res = await fetch(`/api/fee/${feeId}/pay-upi`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'}
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          alert('Payment failed: ' + (data.error || 'Unknown error'));
          return;
        }
        
        // Show success popup instead of receipt modal
        showSuccessPopup(data);
        
        // Refresh fees list
        setTimeout(() => {
          loadStudentFees();
        }, 1000);
        
      } catch (error) {
        console.error('Payment error:', error);
        alert('Payment failed due to network error');
      } finally {
        payButton.disabled = false;
        payButton.textContent = '💳 Pay Now';
      }
    }

    // Close popup when clicking outside
    window.onclick = function(event) {
      const popup = document.getElementById('successPopup');
      if (event.target === popup) {
        closeSuccessPopup();
      }
    }

    window.addEventListener('load', loadStudentFees);

    // Function to download receipt for already paid fees
    async function downloadPaidReceipt(feeId, paymentRef, amount, reason, createdAt) {
      const downloadBtn = event.target;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Loading...';
      
      try {
        // Get student info for receipt
        const ctx = ensureStudent();
        if (!ctx) return;
        
        // Create receipt data object
        const receiptData = {
          fee_id: feeId,
          payment_reference: paymentRef,
          amount: amount,
          reason: reason,
          student_name: ctx.student.full_name || 'Student',
          student_roll: ctx.student.enrollment_number || 'N/A',
          paid_at: createdAt || new Date().toISOString()
        };
        
        // Generate and download PDF
        generatePaidReceiptPDF(receiptData);
        
      } catch (error) {
        console.error('Download error:', error);
        alert('Error downloading receipt. Please try again.');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = '📄 Download';
      }
    }

    // Function to generate PDF for paid receipts
    function generatePaidReceiptPDF(receiptData) {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Helper function to safely convert text
        function safeText(text) {
          if (!text) return '-';
          return String(text).replace(/[^\x20-\x7E]/g, '');
        }

        // Helper function to split text if too long
        function splitText(text, maxWidth) {
          return doc.splitTextToSize(safeText(text), maxWidth);
        }

        doc.setFont('helvetica');

        // Header
        doc.setFontSize(20);
        doc.setTextColor(43, 108, 176);
        doc.text('Fee Payment Receipt', 105, 30, { align: 'center' });

        doc.setFontSize(12);
        doc.setTextColor(102, 102, 102);
        doc.text('College Fee Management System', 105, 40, { align: 'center' });

        // Success badge
        doc.setFillColor(40, 167, 69);
        doc.roundedRect(70, 50, 70, 12, 3, 3, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(10);
        doc.text('PAYMENT COMPLETED', 105, 58, { align: 'center' });

        // Reset
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(11);

        const leftCol = 30;
        const rightCol = 80;
        const maxWidth = 110;
        let currentY = 80;

        // Helper to add row
        function addRow(label, value, isAmount = false) {
          doc.setFont('helvetica', 'bold');
          doc.text(safeText(label), leftCol, currentY);
          
          doc.setFont('helvetica', 'normal');
          if (isAmount) {
            doc.setTextColor(43, 108, 176);
            doc.setFontSize(14);
            doc.text(safeText(value), rightCol, currentY);
            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            currentY += 12;
          } else {
            const lines = splitText(value, maxWidth);
            doc.text(lines, rightCol, currentY);
            currentY += (lines.length * 6) + 6;
          }
        }

        // Add receipt data
        addRow('Receipt Number:', safeText(receiptData.payment_reference));
        addRow('Fee ID:', String(receiptData.fee_id));
        addRow('Student Name:', safeText(receiptData.student_name));
        addRow('Roll Number:', safeText(receiptData.student_roll));
        addRow('Amount Paid:', 'Rs ' + parseFloat(receiptData.amount).toFixed(2), true);
        addRow('Purpose:', safeText(receiptData.reason));
        addRow('Payment Method:', 'UPI');
        addRow('Transaction Ref:', safeText(receiptData.payment_reference));
        
        const dateStr = new Date(receiptData.paid_at).toLocaleDateString('en-IN') + ' ' + 
                       new Date(receiptData.paid_at).toLocaleTimeString('en-IN');
        addRow('Payment Date:', dateStr);
        
        // Status
        doc.setFont('helvetica', 'bold');
        doc.text('Status:', leftCol, currentY);
        doc.setTextColor(40, 167, 69);
        doc.text('PAID', rightCol, currentY);
        doc.setTextColor(0, 0, 0);
        currentY += 15;

        // Line separator
        doc.setDrawColor(221, 221, 221);
        doc.line(30, currentY, 180, currentY);
        currentY += 15;

        // Footer
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.text('Thank you for your payment!', 105, currentY, { align: 'center' });
        currentY += 8;
        
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(102, 102, 102);
        
        const footerLines = splitText('This is a computer-generated receipt and does not require a signature.', 150);
        doc.text(footerLines, 105, currentY, { align: 'center' });
        currentY += footerLines.length * 5 + 5;
        
        doc.text('For queries, contact accounts department', 105, currentY, { align: 'center' });
        currentY += 5;
        doc.text('Email: accounts@college.edu', 105, currentY, { align: 'center' });

        // Verification
        currentY += 15;
        doc.setDrawColor(221, 221, 221);
        doc.line(30, currentY, 180, currentY);
        currentY += 10;
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(8);
        const genDate = new Date().toLocaleDateString('en-IN') + ' ' + new Date().toLocaleTimeString('en-IN');
        doc.text('Downloaded: ' + genDate, 105, currentY, { align: 'center' });
        currentY += 5;
        doc.text('Valid for official purposes', 105, currentY, { align: 'center' });

        // Verification code
        const verCode = String(receiptData.payment_reference).slice(-6);
        doc.setFontSize(9);
        doc.text('Verification: ' + verCode, 105, currentY + 8, { align: 'center' });

        // Save PDF
        const fileName = 'Receipt_' + safeText(receiptData.payment_reference) + '.pdf';
        doc.save(fileName);

        setTimeout(() => {
          alert('Receipt downloaded successfully!');
        }, 500);

      } catch (error) {
        console.error('PDF Error:', error);
        alert('Error generating PDF. Please try again.');
      }
    }
  </script>
</body>
</html>
