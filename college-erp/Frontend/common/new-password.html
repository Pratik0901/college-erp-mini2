<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Set New Password</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#223645;color:#fff}
    .card{background:#fff;color:#222;padding:26px;border-radius:14px;max-width:380px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    h1{font-size:20px;margin:0 0 14px;font-weight:700}
    input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    .btn{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>Set New Password</h1>
    <p id="info" style="font-size:13px;color:#555"></p>
    <input type="password" id="p1" placeholder="New password">
    <input type="password" id="p2" placeholder="Confirm password">
    <button class="btn" onclick="submitNew()">Update Password</button>
    <div id="msg" style="margin-top:10px;font-size:13px;color:#c00"></div>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const email = qs.get('email') || '';
    const role = qs.get('role') || '';
    document.getElementById('info').textContent = `Reset for ${role||'user'}: ${email}`;
    async function submitNew(){
      const p1=document.getElementById('p1').value;
      const p2=document.getElementById('p2').value;
      const msg=document.getElementById('msg');
      if(!p1||p1.length<6){ msg.textContent='Password too short'; return; }
      if(p1!==p2){ msg.textContent='Passwords do not match'; return; }
      msg.textContent='Updating...';
      try{
        // Placeholder API – adjust to backend route
        const res = await fetch('/api/auth/reset', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, role, password: p1 })
        });
        if(res.ok){
          alert('Password updated. Please login.');
          if(role==='admin') location.href='../admin/admin-login.html';
          else if(role==='staff') location.href='../staff/staff-login.html';
          else if(role==='student') location.href='../student/student-login.html';
          else location.href='../index.html';
        } else {
          msg.textContent='Update failed';
        }
      }catch{ msg.textContent='Error updating'; }
    }
  </script>
</body>
</html>
