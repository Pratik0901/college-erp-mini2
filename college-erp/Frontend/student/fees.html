<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fee Portal</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      background: #f6f8fb;
      padding: 20px;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-link {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(20, 30, 50, 0.06);
      padding: 20px;
      margin-bottom: 16px;
    }
    h3 {
      margin: 0 0 12px;
      font-weight: 700;
      font-size: 20px;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #222;
      font-size: 14px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: #2b6cb0;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
    }
    .btn {
      background: #2b6cb0;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1e4d7b;
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn.secondary {
      background: #edf2f7;
      color: #222;
      border: 1px solid #e2e8f0;
    }
    .btn.secondary:hover {
      background: #e2e8f0;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .muted {
      color: #7b8794;
    }
    .small-muted {
      color: #97a0ab;
      font-size: 13px;
    }
    .fees-list-item {
      padding: 12px;
      border-bottom: 1px solid #eef2f6;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .fees-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-pending {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    .status-paid {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status-failed {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .pay-btn {
      background: #28a745;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }
    .pay-btn:hover {
      background: #218838;
    }
    .pay-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    /* Success Popup Styles */
    .success-popup {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    
    .success-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    
    .success-icon {
      font-size: 60px;
      color: #28a745;
      margin-bottom: 20px;
    }
    
    .success-title {
      font-size: 24px;
      font-weight: 700;
      color: #28a745;
      margin-bottom: 10px;
    }
    
    .success-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 25px;
    }
    
    .payment-details {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      text-align: left;
    }
    
    .payment-details .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .detail-row:last-child {
      margin-bottom: 0;
    }
    
    .detail-label {
      font-weight: 600;
      color: #333;
    }
    
    .detail-value {
      color: #666;
    }
    
    .btn-download {
      background: #007bff;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.2s;
    }
    
    .btn-download:hover {
      background: #0056b3;
    }
    
    .btn-close {
      background: #6c757d;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-close:hover {
      background: #545b62;
    }
    @media (max-width: 600px) {
      .button-group {
        flex-direction: column;
      }
      .button-group .btn {
        width: 100%;
      }
      .fees-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back-link" href="student-dashboard.html">← Back to Dashboard</a>
      <div class="small-muted">Fee Portal</div>
    </div>

    <div class="card">
      <h3>💳 Fee Payment</h3>
      <p class="muted">Create a new fee request or view your existing fee records below.</p>

      <form id="feeForm" style="margin-top: 16px">
        <div class="form-group">
          <label>Amount (INR)</label>
          <input type="number" id="feeAmount" min="0" step="0.01" required placeholder="e.g., 1500">
        </div>

        <div class="form-group">
          <label>Reason for payment</label>
          <select id="feeReasonSelect" required>
            <option value="">-- Select reason --</option>
            <option value="Tuition Fee">Tuition Fee</option>
            <option value="Exam Fee">Exam Fee</option>
            <option value="Library Fine">Library Fine</option>
            <option value="Hostel">Hostel</option>
            <option value="Other">Other (specify below)</option>
          </select>
        </div>

        <div class="form-group" id="otherReasonGroup" style="display: none">
          <label>Other - specify</label>
          <input type="text" id="feeReasonOther" maxlength="200" placeholder="Enter reason">
        </div>

        <div class="form-group">
          <label>Preferred payment method (optional)</label>
          <select id="paymentMethod">
            <option value="">-- Select --</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="NetBanking">NetBanking</option>
            <option value="Cash">Cash</option>
          </select>
        </div>

        <div class="button-group">
          <button class="btn" type="submit">Create Fee Request</button>
          <button class="btn secondary" type="button" id="refreshFeesBtn">Refresh List</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>📋 Your Fee Records</h3>
      <div id="studentFeesList">
        <p class="muted">Loading...</p>
      </div>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="successPopup" class="success-popup">
    <div class="success-content">
      <div class="success-icon">✅</div>
      <div class="success-title">Payment Successful!</div>
      <div class="success-message">Your payment has been processed successfully.</div>
      
      <div class="payment-details">
        <div class="detail-row">
          <span class="detail-label">Amount:</span>
          <span class="detail-value" id="successAmount">₹0.00</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Reference ID:</span>
          <span class="detail-value" id="successReference">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Purpose:</span>
          <span class="detail-value" id="successPurpose">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Date:</span>
          <span class="detail-value" id="successDate">-</span>
        </div>
      </div>
      
      <div>
        <button class="btn-download" onclick="downloadReceipt()">📄 Download Receipt</button>
        <button class="btn-close" onclick="closeSuccessPopup()">Close</button>
      </div>
    </div>
  </div>

  <script>
    function ensureStudent() {
      const token = localStorage.getItem('studentToken');
      const sStr = localStorage.getItem('studentData');
      if (!token || !sStr) { window.location.href = 'student-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        return { token, student: s };
      } catch { window.location.href = 'student-login.html'; return null; }
    }

    function getStatusClass(status) {
      if (status === 'paid') return 'status-paid';
      if (status === 'failed') return 'status-failed';
      return 'status-pending';
    }

    function renderFees(fees) {
      if (!fees || fees.length === 0) {
        document.getElementById('studentFeesList').innerHTML = '<div class="muted">No fee records found</div>';
        return;
      }
      const html = fees.map(f => {
        const due = f.due_date ? ('Due: ' + new Date(f.due_date).toLocaleDateString()) : '';
        const created = f.created_at ? new Date(f.created_at).toLocaleString() : '';
        const statusClass = getStatusClass(f.status);
        
        // Add Pay Now button for pending fees
        const payButton = f.status === 'pending' ? 
          `<button class="pay-btn" onclick="payFeeUPI(${f.id}, ${f.amount}, '${f.reason || 'Fee'}')">💳 Pay Now</button>` : '';
        
        return `
          <div class="fees-list-item">
            <div class="fees-top">
              <div><strong>₹${parseFloat(f.amount).toFixed(2)}</strong> — <span class="muted">${f.reason || '—'}</span></div>
              <div>
                <span class="status-badge ${statusClass}">${(f.status || 'pending').toUpperCase()}</span>
                ${payButton}
              </div>
            </div>
            <div class="small-muted">
              ${due ? due + ' • ' : ''}${f.payment_method ? f.payment_method + ' • ' : ''}${f.payment_reference ? 'Ref: ' + f.payment_reference + ' • ' : ''}Created: ${created}
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('studentFeesList').innerHTML = html;
    }

    async function loadStudentFees() {
      const ctx = ensureStudent(); if (!ctx) return;
      try {
        const userId = ctx.student.id;
        const res = await fetch(`/api/student/${userId}/fees`);
        const j = await res.json();
        if (!res.ok) {
          document.getElementById('studentFeesList').innerHTML = '<div class="muted">Error loading fees</div>';
          return;
        }
        renderFees(j);
      } catch (err) {
        console.error(err);
        document.getElementById('studentFeesList').innerHTML = '<div class="muted">Network error</div>';
      }
    }

    document.getElementById('feeReasonSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      document.getElementById('otherReasonGroup').style.display = val === 'Other' ? 'block' : 'none';
      if (val !== 'Other') document.getElementById('feeReasonOther').value = '';
    });

    document.getElementById('feeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ctx = ensureStudent(); if (!ctx) return;
      const userId = ctx.student.id;
      const amount = parseFloat(document.getElementById('feeAmount').value || '0');
      if (!amount || amount <= 0) { alert('Enter a valid amount'); return; }

      let reason = document.getElementById('feeReasonSelect').value;
      if (!reason) { alert('Choose a reason'); return; }
      if (reason === 'Other') {
        const other = document.getElementById('feeReasonOther').value.trim();
        if (!other) { alert('Please specify the reason'); return; }
        reason = other;
      }

      const payment_method = document.getElementById('paymentMethod').value || null;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const res = await fetch(`/api/student/${userId}/pay-fee`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            amount: amount,
            reason: reason,
            payment_method: payment_method
          })
        });
        const j = await res.json();
        if (!res.ok) {
          alert('Error: ' + (j.error || 'Failed to create fee'));
          return;
        }
        alert('✓ Fee request created successfully! Status: Pending');
        document.getElementById('feeForm').reset();
        document.getElementById('otherReasonGroup').style.display = 'none';
        loadStudentFees();
      } catch (err) {
        console.error(err);
        alert('Network error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Fee Request';
      }
    });

    document.getElementById('refreshFeesBtn').addEventListener('click', loadStudentFees);

    // Store current payment data for receipt generation
    let currentPaymentData = null;

    function showSuccessPopup(paymentData) {
      currentPaymentData = paymentData;
      const popup = document.getElementById('successPopup');
      
      // Populate success popup data
      document.getElementById('successAmount').textContent = '₹' + paymentData.amount.toFixed(2);
      document.getElementById('successReference').textContent = paymentData.payment_reference;
      document.getElementById('successPurpose').textContent = paymentData.reason;
      document.getElementById('successDate').textContent = new Date(paymentData.paid_at).toLocaleDateString();
      
      // Show popup
      popup.style.display = 'block';
      
      // Auto-close popup after 8 seconds
      setTimeout(() => {
        if (popup.style.display === 'block') {
          closeSuccessPopup();
        }
      }, 8000);
    }

    function closeSuccessPopup() {
      document.getElementById('successPopup').style.display = 'none';
      currentPaymentData = null;
    }

    function downloadReceipt() {
      if (!currentPaymentData) {
        alert('No payment data available');
        return;
      }

      const receiptHtml = generateReceiptHtml(currentPaymentData);
      
      // Create a blob with the HTML content
      const blob = new Blob([receiptHtml], { type: 'text/html' });
      const url = window.URL.createObjectURL(blob);
      
      // Create a temporary link to download the file
      const link = document.createElement('a');
      link.href = url;
      link.download = `Receipt_${currentPaymentData.payment_reference}.html`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      // Clean up the URL
      window.URL.revokeObjectURL(url);
      
      // Also open in new window for immediate viewing/printing
      const printWindow = window.open('', '_blank');
      printWindow.document.write(receiptHtml);
      printWindow.document.close();
    }

    function generateReceiptHtml(paymentData) {
      return `
        <!DOCTYPE html>
        <html>
        <head>
          <title>Payment Receipt - ${paymentData.payment_reference}</title>
          <style>
            body { 
              font-family: Arial, sans-serif; 
              padding: 30px; 
              max-width: 600px; 
              margin: 0 auto; 
              line-height: 1.6;
            }
            .receipt-header { 
              text-align: center; 
              border-bottom: 3px solid #2b6cb0; 
              padding-bottom: 20px; 
              margin-bottom: 30px; 
            }
            .receipt-header h1 {
              color: #2b6cb0;
              margin: 0 0 10px 0;
              font-size: 28px;
            }
            .receipt-header p {
              color: #666;
              margin: 5px 0;
            }
            .receipt-table { 
              width: 100%; 
              border-collapse: collapse; 
              margin: 30px 0; 
              background: #fff;
            }
            .receipt-table tr:nth-child(even) {
              background: #f9f9f9;
            }
            .receipt-table td { 
              padding: 12px 15px; 
              border-bottom: 1px solid #ddd; 
              vertical-align: top;
            }
            .label { 
              font-weight: 700; 
              color: #333;
              width: 40%; 
            }
            .value {
              color: #666;
            }
            .amount-row {
              background: #e8f4f8 !important;
              font-weight: bold;
            }
            .amount-row .value {
              color: #2b6cb0;
              font-size: 18px;
            }
            .receipt-footer { 
              text-align: center; 
              margin-top: 40px; 
              padding-top: 20px; 
              border-top: 1px solid #ddd; 
              color: #888;
              font-size: 14px;
            }
            .success-badge {
              background: #28a745;
              color: white;
              padding: 8px 16px;
              border-radius: 20px;
              font-weight: bold;
              display: inline-block;
              margin: 10px 0;
            }
            @media print { 
              body { padding: 20px; }
              .no-print { display: none !important; }
            }
          </style>
        </head>
        <body>
          <div class="receipt-header">
            <h1>🧾 Payment Receipt</h1>
            <p>College Fee Management System</p>
            <div class="success-badge">✅ PAYMENT SUCCESSFUL</div>
          </div>
          
          <table class="receipt-table">
            <tr>
              <td class="label">Receipt Number:</td>
              <td class="value">${paymentData.payment_reference}</td>
            </tr>
            <tr>
              <td class="label">Student Name:</td>
              <td class="value">${paymentData.student_name}</td>
            </tr>
            <tr>
              <td class="label">Roll Number:</td>
              <td class="value">${paymentData.student_roll}</td>
            </tr>
            <tr class="amount-row">
              <td class="label">Amount Paid:</td>
              <td class="value">₹${paymentData.amount.toFixed(2)}</td>
            </tr>
            <tr>
              <td class="label">Purpose:</td>
              <td class="value">${paymentData.reason}</td>
            </tr>
            <tr>
              <td class="label">Payment Method:</td>
              <td class="value">UPI</td>
            </tr>
            <tr>
              <td class="label">Transaction Reference:</td>
              <td class="value">${paymentData.payment_reference}</td>
            </tr>
            <tr>
              <td class="label">Payment Date & Time:</td>
              <td class="value">${new Date(paymentData.paid_at).toLocaleString()}</td>
            </tr>
            <tr>
              <td class="label">Status:</td>
              <td class="value" style="color: #28a745; font-weight: bold;">PAID</td>
            </tr>
          </table>
          
          <div class="receipt-footer">
            <p><strong>Thank you for your payment!</strong></p>
            <p>This is a computer-generated receipt and does not require a signature.</p>
            <p>For any queries, please contact the accounts department.</p>
            <p>Generated on: ${new Date().toLocaleString()}</p>
          </div>
        </body>
        </html>
      `;
    }

    async function payFeeUPI(feeId, amount, reason) {
      const payButton = event.target;
      payButton.disabled = true;
      payButton.textContent = 'Processing...';
      
      try {
        const res = await fetch(`/api/fee/${feeId}/pay-upi`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'}
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          alert('Payment failed: ' + (data.error || 'Unknown error'));
          return;
        }
        
        // Show success popup instead of receipt modal
        showSuccessPopup(data);
        
        // Refresh fees list
        setTimeout(() => {
          loadStudentFees();
        }, 1000);
        
      } catch (error) {
        console.error('Payment error:', error);
        alert('Payment failed due to network error');
      } finally {
        payButton.disabled = false;
        payButton.textContent = '💳 Pay Now';
      }
    }

    // Close popup when clicking outside
    window.onclick = function(event) {
      const popup = document.getElementById('successPopup');
      if (event.target === popup) {
        closeSuccessPopup();
      }
    }

    window.addEventListener('load', loadStudentFees);
  </script>
</body>
</html>
