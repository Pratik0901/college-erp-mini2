<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Enter Grades</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <header>
    <div class="profile">
      <img src="https://img.icons8.com/emoji/48/000000/teacher-emoji.png"/>
      <div>
        <div style="font-weight:600" id="staffName">--</div>
        <div class="small-muted" id="staffDept">Faculty Portal</div>
      </div>
    </div>
    <div>
      <a class="btn secondary" href="staff-dashboard.html">← Back</a>
    </div>
  </header>

  <div class="container">
    <h1 style="color:#fff">Enter Grades</h1>
    
    <div class="card" style="margin-top:24px;max-width:600px">
      <form id="gradesForm">
        <div class="form-group">
          <label>Student</label>
          <select id="studentSelect" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Course</label>
          <select id="courseSelect" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semester</label>
          <select id="semesterInput" required>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
          </select>
        </div>
        <div class="form-group">
          <label>Marks (out of 100)</label>
          <input type="number" id="marks" min="0" max="100" required>
        </div>
        <button type="submit" class="btn">Submit Grade (Auto-Computed)</button>
      </form>
    </div>
  </div>

  <style>
    body{font-size:16px;line-height:1.55;font-weight:500;}
    h1,h3,label{font-weight:700;}
    .muted,.small-muted{color:#6b7280!important;}
    .muted{font-size:15px;font-weight:500;line-height:1.5;}
    .small-muted{color:#9ca3af!important;font-size:13px;font-weight:500;}
  </style>

  <script>
    function ensureStaff() {
      const token = localStorage.getItem('staffToken');
      const sStr = localStorage.getItem('staffData');
      if (!token || !sStr) { window.location.href = 'staff-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        document.getElementById('staffName').textContent = s.name || s.username || 'Staff';
        document.getElementById('staffDept').textContent = s.department || 'Faculty Portal';
        return { token, staff: s };
      } catch { window.location.href='staff-login.html'; return null; }
    }
    async function refreshStaffProfile(token) {
      try {
        const res = await fetch('/api/staff/profile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!res.ok) return;
        const j = await res.json();
        if (j.success && j.staff) {
          localStorage.setItem('staffData', JSON.stringify(j.staff));
          document.getElementById('staffName').textContent = j.staff.name || j.staff.username || 'Staff';
          document.getElementById('staffDept').textContent = j.staff.department || 'Faculty Portal';
        }
      } catch {}
    }

    async function loadData() {
      const [studentsRes, coursesRes] = await Promise.all([
        fetch('/api/staff/students'),
        fetch('/api/staff/courses')
      ]);
      
      const students = await studentsRes.json();
      const courses = await coursesRes.json();
      
      document.getElementById('studentSelect').innerHTML = 
        '<option value="">-- Select Student --</option>' +
        students.map(s => `<option value="${s.id}">${s.roll_no} - ${s.full_name}</option>`).join('');
      
      // Store course code in option value for easier auto-grading
      document.getElementById('courseSelect').innerHTML = 
        '<option value="">-- Select Course --</option>' +
        courses.map(c => `<option value="${c.code}">${c.code} - ${c.title}</option>`).join('');
    }
    
    document.getElementById('gradesForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ctx = ensureStaff();
      if (!ctx) return;

      const studentId = parseInt(document.getElementById('studentSelect').value);
      const courseCode = document.getElementById('courseSelect').value;
      const marks = parseFloat(document.getElementById('marks').value);
      const semNo = parseInt(document.getElementById('semesterInput').value);

      if (!courseCode) {
        alert('Please select a course');
        return;
      }

      const payload = {
        student_id: studentId,
        sem_no: semNo,
        subjects: [
          { course_code: courseCode, marks: marks }
        ],
        entered_by_user_id: ctx.staff.id
      };

      try {
        const res = await fetch('/api/staff/grades/auto', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const j = await res.json();
        if (!res.ok) {
          alert('Error: ' + (j.error || 'Failed to save'));
          return;
        }
        
        const semesterGPA = j.semester_gpa !== undefined ? j.semester_gpa.toFixed(2) : 'N/A';
        const grade = j.subjects && j.subjects[0] ? j.subjects[0].grade : 'N/A';
        alert(`Grade computed & saved!\nGrade: ${grade}\nSemester GPA: ${semesterGPA}`);
        e.target.reset();
      } catch (err) {
        console.error(err);
        alert('Network or server error');
      }
    });
    
    window.addEventListener('load', () => {
      const ctx = ensureStaff(); if (!ctx) return;
      refreshStaffProfile(ctx.token);
      loadData();
    });
  </script>
</body>
</html>
