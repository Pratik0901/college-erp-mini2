<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload Study Materials</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <header>
    <div class="profile">
      <img src="https://img.icons8.com/emoji/48/000000/teacher-emoji.png"/>
      <div>
        <div style="font-weight:600" id="staffName">--</div>
        <div class="small-muted" id="staffDept">Faculty Portal</div>
      </div>
    </div>
    <div>
      <a class="btn secondary" href="staff-dashboard.html">← Back</a>
    </div>
  </header>

  <div class="container">
    <h1 style="color:#fff">Upload Study Materials</h1>
    
    <div class="card" style="margin-top:24px;max-width:600px">
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Course</label>
          <select id="courseSelect" name="course_id" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" name="title" required placeholder="e.g., Lecture Notes - Chapter 5">
        </div>
        <div class="form-group">
          <label>File</label>
          <input type="file" id="fileInput" name="file" required accept=".pdf,.doc,.docx,.ppt,.pptx">
        </div>
        <button type="submit" class="btn">Upload Material</button>
      </form>
    </div>
  </div>

  <style>
    body{font-size:16px;line-height:1.55;font-weight:500;}
    h1,h3,label{font-weight:700;}
    .muted,.small-muted{color:#e4e8ed!important;}
  </style>

  <script>
    // + profile: ensure + refresh
    function ensureStaff() {
      const token = localStorage.getItem('staffToken');
      const sStr = localStorage.getItem('staffData');
      if (!token || !sStr) { window.location.href = 'staff-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        document.getElementById('staffName').textContent = s.name || s.username || 'Staff';
        document.getElementById('staffDept').textContent = s.department || 'Faculty Portal';
        return { token, staff: s };
      } catch {
        window.location.href = 'staff-login.html'; return null;
      }
    }
    async function refreshStaffProfile(token) {
      try {
        const res = await fetch('/api/staff/profile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!res.ok) return;
        const j = await res.json();
        if (j.success && j.staff) {
          localStorage.setItem('staffData', JSON.stringify(j.staff));
          document.getElementById('staffName').textContent = j.staff.name || j.staff.username || 'Staff';
          document.getElementById('staffDept').textContent = j.staff.department || 'Faculty Portal';
        }
      } catch {}
    }

    async function loadCourses() {
      const res = await fetch('/api/staff/courses');
      const courses = await res.json();
      
      document.getElementById('courseSelect').innerHTML = 
        '<option value="">-- Select Course --</option>' +
        courses.map(c => `<option value="${c.id}">${c.code} - ${c.title}</option>`).join('');
    }
    
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      
      try {
        const res = await fetch('/api/staff/upload-material', { method: 'POST', body: formData });
        if (res.ok) { alert('Material uploaded successfully!'); e.target.reset(); }
      } catch (err) { alert('Error uploading material'); }
    });

    window.addEventListener('load', () => {
      const ctx = ensureStaff(); if (!ctx) return;
      refreshStaffProfile(ctx.token);
      loadCourses();
    });
  </script>
</body>
</html>
