<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Forgot Password</title>
  <link rel="stylesheet" href="../common/styles.css">
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#334e6d;color:#fff}
    .card{max-width:420px;width:100%;padding:28px;border-radius:16px;background:#fff;color:#222;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    h1{font-size:22px;margin:0 0 16px;font-weight:700}
    .muted{color:#555;font-size:13px;margin-bottom:12px}
    .form-group{margin-bottom:14px}
    input[type=email],input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    .otpverify{display:none;flex-direction:column;gap:10px;margin-top:10px}
    button{cursor:pointer}
    .btn{display:inline-block;background:#ff6b6b;border:none;color:#fff;padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px}
    .btn.secondary{background:#607d8b}
  </style>
  <script src="https://smtpjs.com/v3/smtp.js"></script>
  <script src="../common/otp.js"></script>
</head>
<body>
  <div class="card">
    <h1>Reset Password (Admin)</h1>
    <p class="muted">Enter your registered admin email. An OTP will be mailed for verification.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="admin@example.com">
    </div>
    <button class="btn" onclick="sendOTP('admin')">Send OTP</button>
    <div class="otpverify">
      <input type="text" id="otp_inp" placeholder="Enter OTP">
      <button class="btn secondary" id="otp-btn">Verify OTP</button>
    </div>
    <div id="msg" class="muted"></div>
    <div style="margin-top:10px">
      <a href="admin-login.html" class="muted" style="text-decoration:none">← Back to Login</a>
    </div>
  </div>
  <script>
    function sendOTP(role){
      const email = document.getElementById('email');
      const otpverify = document.getElementsByClassName('otpverify')[0];
      if(!email.value){ alert('Enter email'); return; }
      let otp_val = Math.floor(1000 + Math.random() * 9000);
      let emailbody = `<h2>Password Reset OTP</h2><p>Your OTP: <b>${otp_val}</b></p>`;
      Email.send({
        SecureToken: "00c5a91d-97f4-47ef-a383-eb3b241ea9d0",
        To: email.value,
        From: "pratikmg09@gmail.com",
        Subject: "Admin Password Reset OTP",
        Body: emailbody
      }).then(message=>{
        if(message==="OK"){
          alert("OTP sent to " + email.value);
          otpverify.style.display="flex";
          const otp_inp = document.getElementById('otp_inp');
          const otp_btn = document.getElementById('otp-btn');
          otp_btn.onclick = () => {
            if(otp_inp.value == otp_val){
              alert("OTP verified");
              location.href = `new-password.html?role=${role}&email=${encodeURIComponent(email.value)}`;
            } else {
              alert("Invalid OTP");
            }
          };
        } else {
          alert("Send failed");
        }
      }).catch(e=>{
        console.error(e);
        alert("Error sending OTP");
      });
    }
  </script>
</body>
</html>
