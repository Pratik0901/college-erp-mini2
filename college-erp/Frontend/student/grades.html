<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grade Reports</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <header>
    <div class="profile">
      <img src="https://img.icons8.com/emoji/48/000000/student-emoji.png"/>
      <div>
        <div style="font-weight:600" id="studentName">--</div>
        <div class="small-muted" id="studentUsername">@--</div>
      </div>
    </div>
    <div>
      <a class="btn secondary" href="student-dashboard.html">← Back</a>
    </div>
  </header>

  <div class="container">
    <h1 style="color:#fff">Grade Reports</h1>
    
    <div class="card" style="margin-top:24px">
      <h3>Semester Grades</h3>
      <table id="gradesTable">
        <thead>
          <tr>
            <th>Course Code</th>
            <th>Course Title</th>
            <th>Marks</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <style>
    body{font-size:16px;line-height:1.55;font-weight:500;}
    h1,h3{font-weight:700;}
    #gradesTable th{font-size:15px;font-weight:700;}
    #gradesTable td{font-size:15px;}
    .pill{font-weight:600;}
  </style>

  <script>
    function ensureStudent() {
      const token = localStorage.getItem('studentToken');
      const sStr = localStorage.getItem('studentData');
      if (!token || !sStr) { window.location.href='student-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        document.getElementById('studentName').textContent = s.full_name || s.username;
        document.getElementById('studentUsername').textContent = '@' + (s.username || '');
        return s;
      } catch { window.location.href='student-login.html'; return null; }
    }

    async function loadGrades(uid) {
      try {
        const res = await fetch(`/api/student/${uid}/grades`);
        const grades = await res.json();
        const tbody = document.querySelector('#gradesTable tbody');
        if ((grades || []).length > 0) {
          tbody.innerHTML = grades.map(g => `
            <tr>
              <td>${g.code}</td>
              <td>${g.title}</td>
              <td>${g.marks}</td>
              <td><span class="pill">${g.grade}</span></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="4">No grades available</td></tr>';
        }
      } catch (e) { console.error('Error:', e); }
    }

    window.addEventListener('load', () => {
      const s = ensureStudent(); if (!s) return;
      loadGrades(s.id);
    });
  </script>
</body>
</html>
