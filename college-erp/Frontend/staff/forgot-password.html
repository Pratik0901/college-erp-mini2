<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Staff Forgot Password</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../common/styles.css">
  <style>
    body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#2e566c;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
    .card{background:#fff;color:#222;padding:28px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    h1{margin:0 0 12px;font-size:22px;font-weight:700}
    input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:12px}
    .btn{background:#4ecdc4;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer}
    small{display:block;margin-top:6px;color:#555}
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password (Staff)</h1>
    <input id="email" type="email" placeholder="Registered email">
    <button class="btn" onclick="sendOtp()">Send OTP</button>
    <div id="otpBox" style="display:none;margin-top:10px">
      <input id="otp" placeholder="Enter OTP">
      <button class="btn" onclick="verifyOtp()">Verify OTP</button>
    </div>
    <div id="msg" style="margin-top:10px;font-size:13px;color:#c00"></div>
    <small><a href="staff-login.html">← Back to Login</a></small>
  </div>
  <script>
    let emailCache=null;
    async function sendOtp(){
      const email=document.getElementById('email').value.trim();
      if(!email){alert('Enter email');return;}
      emailCache=email;
      const res=await fetch('/api/forgot-password/request-otp',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email})
      });
      const j=await res.json();
      document.getElementById('msg').textContent=j.message||j.error||'';
      if(j.ok) document.getElementById('otpBox').style.display='block';
    }
    async function verifyOtp(){
      const otp=document.getElementById('otp').value.trim();
      if(!otp){alert('Enter OTP');return;}
      const res=await fetch('/api/forgot-password/verify-otp',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:emailCache,otp})
      });
      const j=await res.json();
      if(j.ok){
        location.href=`reset-password.html?user_id=${j.user_id}&reset_id=${j.reset_id}&role=staff`;
      }else alert(j.error||'Failed');
    }
  </script>
</body>
</html>
