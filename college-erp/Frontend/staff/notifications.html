<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send Notification</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* visibility overrides */
    body{font-size:16px;line-height:1.55;font-weight:500;}
    h1,h3,label{font-weight:700;}
    .small-muted,.muted{color:#6b7280!important;}
    .muted{font-size:15px;font-weight:500;line-height:1.5;}
    .small-muted{color:#9ca3af!important;font-size:13px;font-weight:500;}
    .btn{font-weight:600;}
  </style>
</head>
<body>
  <header>
    <div class="profile">
      <img src="https://img.icons8.com/emoji/48/000000/teacher-emoji.png"/>
      <div>
        <div style="font-weight:600" id="staffName">--</div>
        <div class="small-muted" id="staffDept">Faculty Portal</div>
      </div>
    </div>
    <div>
      <a class="btn secondary" href="staff-dashboard.html">← Back</a>
    </div>
  </header>

  <div class="container">
    <h1 style="color:#fff">Send Notification</h1>
    
    <div class="card" style="margin-top:24px;max-width:600px">
      <form id="notificationForm">
        <div class="form-group">
          <label>Target Audience</label>
          <select id="targetRole" required>
            <option value="student">Students</option>
            <option value="staff">Faculty</option>
            <option value="all">Everyone</option>
          </select>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" required placeholder="e.g., Important Announcement">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="body" required placeholder="Enter your message here..."></textarea>
        </div>
        <div class="form-group" style="margin-top:12px">
          <label><input type="checkbox" id="specificToggle"> Send to specific user (optional)</label>
        </div>
        <div class="form-group" id="specificUserWrapper" style="display:none">
          <label>Select User</label>
          <select id="specificUserSelect">
            <option value="">-- Select User --</option>
          </select>
        </div>
        <button type="submit" class="btn">Send Notification</button>
      </form>
    </div>
  </div>

  <script>
    function ensureStaff() {
      const token = localStorage.getItem('staffToken');
      const sStr = localStorage.getItem('staffData');
      if (!token || !sStr) { window.location.href = 'staff-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        document.getElementById('staffName').textContent = s.name || s.username || 'Staff';
        document.getElementById('staffDept').textContent = s.department || 'Faculty Portal';
        return { token, staff: s };
      } catch { window.location.href='staff-login.html'; return null; }
    }
    async function refreshStaffProfile(token) {
      try {
        const res = await fetch('/api/staff/profile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!res.ok) return;
        const j = await res.json();
        if (j.success && j.staff) {
          localStorage.setItem('staffData', JSON.stringify(j.staff));
          document.getElementById('staffName').textContent = j.staff.name || j.staff.username || 'Staff';
          document.getElementById('staffDept').textContent = j.staff.department || 'Faculty Portal';
        }
      } catch {}
    }

    const targetRoleEl = document.getElementById('targetRole');
    const toggleEl = document.getElementById('specificToggle');
    const wrapperEl = document.getElementById('specificUserWrapper');
    const selectEl = document.getElementById('specificUserSelect');

    async function loadUsersForRole(role){
      try {
        if(role==='student'){
          const r = await fetch('/api/admin/students');
          const data = await r.json();
          selectEl.innerHTML = '<option value="">-- Select Student --</option>' +
            data.map(s => `<option value="${s.user_id}">${s.roll_no} - ${s.full_name}</option>`).join('');
        } else if(role==='staff'){
          const r = await fetch('/api/admin/staff');
          const data = await r.json();
          selectEl.innerHTML = '<option value="">-- Select Staff --</option>' +
            data.map(s => `<option value="${s.user_id}">${s.username} - ${s.full_name}</option>`).join('');
        } else {
          selectEl.innerHTML = '<option value="">-- Not applicable --</option>';
        }
      } catch {
        selectEl.innerHTML = '<option value="">-- Load failed --</option>';
      }
    }

    function updateSpecificVisibility(){
      if(toggleEl.checked){
        wrapperEl.style.display='block';
        loadUsersForRole(targetRoleEl.value);
      } else {
        wrapperEl.style.display='none';
        selectEl.value='';
      }
    }

    targetRoleEl.addEventListener('change', () => {
      if(toggleEl.checked) loadUsersForRole(targetRoleEl.value);
    });
    toggleEl.addEventListener('change', updateSpecificVisibility);

    document.getElementById('notificationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        title: document.getElementById('title').value,
        body: document.getElementById('body').value,
        target_role: targetRoleEl.value
      };
      if (toggleEl.checked && selectEl.value) data.target_user_id = parseInt(selectEl.value,10);
      const staffData = localStorage.getItem('staffData');
      if (staffData) { try { const s=JSON.parse(staffData); if(s.id) data.sender_user_id=s.id; } catch{} }
      try {
        const res = await fetch('/api/notification', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(data)
        });
        const j = await res.json().catch(()=>({}));
        if (res.ok) {
          alert('Notification sent. Emails queued: '+(j.emails_queued??0));
          e.target.reset(); updateSpecificVisibility();
        } else {
          alert('Failed: ' + (j.error || res.status));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    window.addEventListener('load', () => {
      const ctx = ensureStaff(); if (!ctx) return;
      refreshStaffProfile(ctx.token);
    });
  </script>
</body>
</html>
