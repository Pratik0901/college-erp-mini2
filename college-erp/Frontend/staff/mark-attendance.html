<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mark Attendance</title>
  <link rel="stylesheet" href="../common/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <header>
    <div class="profile">
      <img src="https://img.icons8.com/emoji/48/000000/teacher-emoji.png"/>
      <div>
        <div style="font-weight:600" id="staffName">--</div>
        <div class="small-muted" id="staffDept">Faculty Portal</div>
      </div>
    </div>
    <div>
      <a class="btn secondary" href="staff-dashboard.html">← Back</a>
    </div>
  </header>

  <div class="container">
    <h1 style="color:#fff">Mark Attendance</h1>
    
    <div class="card" style="margin-top:24px">
      <form id="attendanceForm">
        <div class="form-group">
          <label>Select Course</label>
          <select id="courseSelect" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="dateInput" required>
        </div>
        
        <h3 style="margin-top:24px">Student List</h3>
        <div id="studentsList">
          <p class="muted">Select a course first</p>
        </div>
        
        <button type="submit" class="btn" style="margin-top:16px">Submit Attendance</button>
      </form>
    </div>
  </div>

  <style>
    body{font-size:16px;line-height:1.55;font-weight:500;}
    h1,h3,label{font-weight:700;}
    .muted,.small-muted{color:#6b7280!important;}
    .muted{font-size:15px;font-weight:500;line-height:1.5;}
    .small-muted{color:#9ca3af!important;font-size:13px;font-weight:500;}
  </style>

  <script>
    function ensureStaff() {
      const token = localStorage.getItem('staffToken');
      const sStr = localStorage.getItem('staffData');
      if (!token || !sStr) { window.location.href = 'staff-login.html'; return null; }
      try {
        const s = JSON.parse(sStr);
        document.getElementById('staffName').textContent = s.name || s.username || 'Staff';
        document.getElementById('staffDept').textContent = s.department || 'Faculty Portal';
        return { token, staff: s };
      } catch { window.location.href='staff-login.html'; return null; }
    }
    async function refreshStaffProfile(token) {
      try {
        const res = await fetch('/api/staff/profile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!res.ok) return;
        const j = await res.json();
        if (j.success && j.staff) {
          localStorage.setItem('staffData', JSON.stringify(j.staff));
          document.getElementById('staffName').textContent = j.staff.name || j.staff.username || 'Staff';
          document.getElementById('staffDept').textContent = j.staff.department || 'Faculty Portal';
        }
      } catch {}
    }

    async function loadCourses() {
      const res = await fetch('/api/staff/courses');
      const courses = await res.json();
      
      const select = document.getElementById('courseSelect');
      select.innerHTML = '<option value="">-- Select Course --</option>' +
        courses.map(c => `<option value="${c.id}">${c.code} - ${c.title}</option>`).join('');
    }
    
    async function loadStudents() {
      const res = await fetch('/api/staff/students');
      const students = await res.json();
      
      const html = students.map(s => `
        <div style="padding:12px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px">
          <input type="checkbox" id="student_${s.id}" value="${s.id}" checked>
          <label for="student_${s.id}">${s.roll_no} - ${s.full_name}</label>
        </div>
      `).join('');
      
      document.getElementById('studentsList').innerHTML = html;
    }
    
    document.getElementById('courseSelect').addEventListener('change', (e) => {
      if (e.target.value) loadStudents();
    });
    
    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const course_id = document.getElementById('courseSelect').value;
      const date = document.getElementById('dateInput').value;
      const checkboxes = document.querySelectorAll('#studentsList input[type="checkbox"]');
      
      const students = Array.from(checkboxes).map(cb => ({
        student_id: parseInt(cb.value),
        present: cb.checked
      }));
      
      try {
        const res = await fetch('/api/staff/attendance', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ course_id, date, students })
        });
        
        if (res.ok) {
          alert('Attendance marked successfully!');
          window.location.href = 'staff-dashboard.html';
        }
      } catch (e) {
        alert('Error marking attendance');
      }
    });
    
    window.addEventListener('load', () => {
      const ctx = ensureStaff(); if (!ctx) return;
      refreshStaffProfile(ctx.token);
      document.getElementById('dateInput').valueAsDate = new Date();
      loadCourses();
    });
  </script>
</body>
</html>
