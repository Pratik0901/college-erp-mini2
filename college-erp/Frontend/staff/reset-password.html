<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../common/styles.css">
  <style>
    body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#2e566c;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
    .card{background:#fff;color:#222;padding:28px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    h1{margin:0 0 14px;font-size:22px;font-weight:700}
    input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:12px}
    .btn{background:#4ecdc4;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer}
    small{display:block;margin-top:6px;color:#555}
  </style>
</head>
<body>
  <div class="card">
    <h1>Set New Password</h1>
    <input id="p1" type="password" placeholder="New password">
    <input id="p2" type="password" placeholder="Confirm password">
    <button class="btn" onclick="doReset()">Update Password</button>
    <div id="msg" style="margin-top:10px;font-size:13px;color:#c00"></div>
    <small><a href="staff-login.html">← Back to Login</a></small>
  </div>
  <script>
    const qs=new URLSearchParams(location.search);
    const reset_id=qs.get('reset_id'); const user_id=qs.get('user_id');
    async function doReset(){
      const p1=document.getElementById('p1').value;
      const p2=document.getElementById('p2').value;
      const msg=document.getElementById('msg');
      if(p1.length<6){msg.textContent='Password too short';return;}
      if(p1!==p2){msg.textContent='Mismatch';return;}
      const res=await fetch('/api/forgot-password/reset',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({reset_id,user_id,password:p1})
      });
      const j=await res.json();
      msg.textContent=j.message||j.error||'';
      if(j.ok){ setTimeout(()=>location.href='staff-login.html',1500); }
    }
  </script>
</body>
</html>
